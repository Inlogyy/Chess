# chess-tilt settings. Every line is optional: delete one to use its default.
# After changing an [analysis] setting, run:  py tilt.py report
# (the program rebuilds the player timelines automatically when needed).

[extract]
workers = 0                   # worker processes; 0 = number of CPU cores minus one
chunk_mb = 8                  # size of the pieces the file is split into
keep_correspondence = false   # correspondence games take days per move, so they are dropped

[analysis]
session_gap_minutes = 30      # same sitting = next game starts within this many minutes of the last one ending
max_rating_change = 30        # skip games where the rating moved more than this (new, provisional ratings)
min_trigger_plies = 10        # the game before must have at least this many half-moves to count
speeds = ["ultrabullet", "bullet", "blitz", "rapid", "classical"]
min_games_within_player = 10  # games a player needs for the "vs. their own average" check

[system]
memory_limit = ""             # e.g. "8GB"; empty = 60% of your RAM
threads = 0                   # 0 = all CPU cores
